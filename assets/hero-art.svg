      <path d="M256 236h26c5 0 8 4 8 8v66h-42v-66c0-4 3-8 8-8Z" class="cream"/>
      <path d="M256 236h26c5 0 8 4 8 8v66h-42v-66c0-4 3-8 8-8Z" class="ink"/>
      <path d="M262 246h14" class="ink" stroke-opacity=".45"/>
