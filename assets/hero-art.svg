    <path d="M304 390h60c5 0 9 4 9 9v8c0 5-4 9-9 9h-60c-5 0-9-4-9-9v-8c0-5 4-9 9-9Z" class="cream"/>
    <path d="M304 390h60c5 0 9 4 9 9v8c0 5-4 9-9 9h-60c-5 0-9-4-9-9v-8c0-5 4-9 9-9Z" class="ink"/>
    <path d="M312 424c4-4 4-8 0-12M320 400c4-4 4-7 0-11" class="ink" stroke-opacity=".55"/>
  </g>

  <!-- bubbles + line sparkles -->
  <circle cx="176" cy="196" r="15" class="cream"/>
  <circle cx="176" cy="196" r="15" class="ink"/>
  <circle cx="171" cy="191" r="3.6" fill="#F79BCB"/>
  <circle cx="212" cy="160" r="9" class="cream"/>
  <circle cx="212" cy="160" r="9" class="ink"/>
  <circle cx="132" cy="150" r="6" class="cream"/>
  <circle cx="132" cy="150" r="6" class="ink"/>
  <path d="M300 128v22M289 139h22" class="ink3" stroke-opacity=".65"/>
  <path d="M258 214v14M251 221h14" class="ink3" stroke-opacity=".45"/>
  <path d="M74 190v12M68 196h12" class="ink3" stroke-opacity=".4"/>
  <circle cx="344" cy="242" r="11" class="cream"/>
  <circle cx="344" cy="242" r="11" class="ink"/>
  <circle cx="340" cy="238" r="2.8" fill="#F79BCB"/>
  <circle cx="360" cy="286" r="6" class="cream"/>
  <circle cx="360" cy="286" r="6" class="ink"/>
</svg>
