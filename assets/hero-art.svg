      <path d="M248 310h42v16h-42z" class="ink"/>
      <path d="M254 326v14M263 326v16M272 326v16M281 326v14" class="ink3" stroke-opacity=".55"/>
    </g>
    <path d="M214 346h96l-12 92c-1 9-9 14-18 14h-36c-9 0-17-5-18-14Z" class="pink-l"/>
    <path d="M214 346h96l-12 92c-1 9-9 14-18 14h-36c-9 0-17-5-18-14Z" class="ink"/>
    <path d="M232 384h60l-4 28h-52Z" fill="#fff" opacity=".4"/>
    <path d="M208 326h108c4 0 7 3 7 7v6c0 4-3 7-7 7H208c-4 0-7-3-7-7v-6c0-4 3-7 7-7Z" class="cream"/>
    <path d="M208 326h108c4 0 7 3 7 7v6c0 4-3 7-7 7H208c-4 0-7-3-7-7v-6c0-4 3-7 7-7Z" class="ink"/>
  </g>

