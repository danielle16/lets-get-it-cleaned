<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="420" height="540" role="img"
     aria-label="Illustration of cleaning supplies: a spray bottle, a bucket with a scrub brush, folded towels and a small plant">
  <defs>
    <linearGradient id="arch" x1="60" y1="20" x2="360" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBE6EF"/><stop offset="1" stop-color="#F6D2E4"/>
    </linearGradient>
    <clipPath id="archClip"><path d="M30 200a180 180 0 0 1 360 0v300H30Z"/></clipPath>
  </defs>
  <style>
    .ink{fill:none;stroke:#241021;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}
    .ink3{fill:none;stroke:#241021;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.2}
    .pink{fill:#E8449B}.pink-l{fill:#F79BCB}.cream{fill:#FFF7FB}.mint{fill:#CFEDE4}
  </style>

  <path d="M30 200a180 180 0 0 1 360 0v300H30Z" fill="url(#arch)"/>
  <g clip-path="url(#archClip)">
    <circle cx="104" cy="150" r="58" fill="#fff" opacity=".35"/>
    <circle cx="330" cy="330" r="78" fill="#fff" opacity=".25"/>
  </g>
  <path d="M30 200a180 180 0 0 1 360 0v300" class="ink" stroke-opacity=".45"/>

  <!-- shelf / ground line -->
  <path d="M46 452h328" class="ink3"/>

  <!-- ===== spray bottle ===== -->
  <g>
    <path d="M96 236h30v26H96z" class="cream"/>
    <path d="M96 236h30v26H96z" class="ink"/>
    <path d="M96 244H66c-4 0-6 3-5 7l5 14c1 4 5 6 9 4l21-9Z" class="pink-l"/>
    <path d="M96 244H66c-4 0-6 3-5 7l5 14c1 4 5 6 9 4l21-9Z" class="ink"/>
    <path d="M84 264c5 6 9 13 9 20" class="ink"/>
    <path d="M57 247h-9v10h9" class="pink"/>
    <path d="M57 247h-9v10h9" class="ink"/>
    <path d="M90 262h44c14 0 24 11 24 25v141c0 13-10 24-24 24H90c-14 0-24-11-24-24V287c0-14 10-25 24-25Z" class="pink"/>
    <path d="M90 262h44c14 0 24 11 24 25v141c0 13-10 24-24 24H90c-14 0-24-11-24-24V287c0-14 10-25 24-25Z" class="ink"/>
    <path d="M78 306h58v54H78z" class="cream"/>
    <path d="M78 306h58v54H78z" class="ink"/>
    <path d="M90 322h34M90 336h24" class="ink" stroke-opacity=".5"/>
    <path d="M66 396h92" class="ink" stroke-opacity=".35"/>
  </g>

